name: Windows — Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-test:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      RELEASE_VERSION: "0.0-test"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Validate locales
        working-directory: app
        run: npm run i18n:validate

      - name: Build Windows portable installer
        working-directory: app
        run: npm run dist:win

      - name: Verify single portable setup executable
        shell: pwsh
        run: |
          $exe = "app/release/Telegram-Drive-0.0-test-portable-setup.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Expected installer not found at $exe"
          }

      - name: Upload installer run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Drive-windows-test-portable-setup
          path: app/release/Telegram-Drive-0.0-test-portable-setup.exe
          if-no-files-found: error
          retention-days: 14
