# DOES: Builds and signs the Android APK from any branch labeled with the Latest release version (or 1.0) and uploads a 7-day artifact.
# DOES NOT: Create versions, tags, or GitHub Releases, or commit version changes.

name: Android — Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve test build version label
        id: ver
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RAW_BRANCH: ${{ github.ref_name }}
          FULL_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          TAG=$(gh release view --json tagName -q .tagName 2>/dev/null || true)
          RAW_VER="${TAG#v}"
          if echo "$RAW_VER" | grep -Eq '^[0-9]+\.[0-9](\.[0-9])?$'; then
            LABEL_VER="$RAW_VER"
          else
            LABEL_VER="1.0"
          fi
          if echo "$LABEL_VER" | grep -Eq '^[0-9]+\.[0-9]$'; then
            SEMVER="${LABEL_VER}.0"
          else
            SEMVER="${LABEL_VER}"
          fi
          CLEAN_BRANCH=$(printf '%s' "$RAW_BRANCH" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/-+/-/g')
          SHORT_SHA=$(printf '%s' "$FULL_SHA" | cut -c1-7)
          ARTIFACT_NAME="${REPO_NAME}-${CLEAN_BRANCH}-${SHORT_SHA}-v${LABEL_VER}"

          echo "version=$LABEL_VER" >> "$GITHUB_OUTPUT"
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

      - name: Prepare permanent signing keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Missing permanent Android signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Configure them in Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          KS_FILE="${RUNNER_TEMP}/telegram-drive-test.p12"
          printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$KS_FILE"
          echo "ks_path=$KS_FILE" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install web dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Ephemerally inject test build version (never committed)
        working-directory: app
        env:
          TARGET_SEMVER: ${{ steps.ver.outputs.semver }}
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.version=process.env.TARGET_SEMVER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Validate locales & sync Capacitor Android
        working-directory: app
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          VITE_RELEASE_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          npm run i18n:validate
          npm run cap:sync

      - name: Build signed Android APK
        working-directory: app/android
        env:
          RELEASE_VERSION: ${{ steps.ver.outputs.version }}
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.ks_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature & stage artifact
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          LABEL_VER: ${{ steps.ver.outputs.version }}
        run: |
          APK_OUT=$(find app/android/app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK_OUT" ] || [ ! -f "$APK_OUT" ]; then
            echo "::error::Signed APK output not found in app/android/app/build/outputs/apk/release."
            exit 1
          fi
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs "$APK_OUT"
          cp "$APK_OUT" "${RUNNER_TEMP}/${REPO_NAME}-${LABEL_VER}.apk"

      - name: Upload APK run artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.artifact_name }}
          path: ${{ runner.temp }}/${{ github.event.repository.name }}-${{ steps.ver.outputs.version }}.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Write run summary
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          LABEL_VER: ${{ steps.ver.outputs.version }}
          ARTIFACT_NAME: ${{ steps.ver.outputs.artifact_name }}
        run: |
          {
            echo "### Android — Test Build"
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Branch | \`${BRANCH_NAME}\` |"
            echo "| Label Version | \`v${LABEL_VER}\` (test label only) |"
            echo "| Tag | None (test build) |"
            echo "| Artifact | \`${ARTIFACT_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean temporary keystore and staged APK
        if: always()
        run: rm -f "${RUNNER_TEMP}/telegram-drive-test.p12" "${RUNNER_TEMP}"/*.apk
