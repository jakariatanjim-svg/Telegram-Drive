name: Android — Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Install web dependencies
        working-directory: app
        run: npm ci --ignore-scripts

      - name: Validate locales & sync Capacitor Android
        working-directory: app
        run: |
          npm run i18n:validate
          npm run cap:sync

      - name: Prepare signing keystore
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          KS_FILE="${RUNNER_TEMP}/telegram-drive-test.p12"
          if [ -n "$KS_B64" ] && [ -n "$KS_PASS" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASS" ]; then
            printf '%s' "$KS_B64" | tr -d '[:space:]' | base64 -d > "$KS_FILE"
            echo "ks_path=$KS_FILE" >> "$GITHUB_OUTPUT"
            echo "ks_pass=$KS_PASS" >> "$GITHUB_OUTPUT"
            echo "key_alias=$KEY_ALIAS" >> "$GITHUB_OUTPUT"
            echo "key_pass=$KEY_PASS" >> "$GITHUB_OUTPUT"
          else
            EPHEMERAL_PASS="tgdrive_ci_test_only"
            keytool -genkeypair -v \
              -storetype PKCS12 \
              -keystore "$KS_FILE" \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -alias tgdrive_test \
              -storepass "$EPHEMERAL_PASS" \
              -keypass "$EPHEMERAL_PASS" \
              -dname "CN=Telegram Drive Test,O=Telegram Drive,C=US"
            echo "ks_path=$KS_FILE" >> "$GITHUB_OUTPUT"
            echo "ks_pass=$EPHEMERAL_PASS" >> "$GITHUB_OUTPUT"
            echo "key_alias=tgdrive_test" >> "$GITHUB_OUTPUT"
            echo "key_pass=$EPHEMERAL_PASS" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed Android APK
        working-directory: app/android
        env:
          RELEASE_VERSION: "1.0"
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.ks_path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ steps.keystore.outputs.ks_pass }}
          ANDROID_KEY_ALIAS: ${{ steps.keystore.outputs.key_alias }}
          ANDROID_KEY_PASSWORD: ${{ steps.keystore.outputs.key_pass }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Stage APK artifact
        run: |
          APK_OUT=$(find app/android/app/build/outputs/apk/release -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK_OUT" ] || [ ! -f "$APK_OUT" ]; then
            echo "Signed APK output not found!" >&2
            exit 1
          fi
          cp "$APK_OUT" "${RUNNER_TEMP}/Telegram-Drive-test.apk"

      - name: Upload APK run artifact
        uses: actions/upload-artifact@v4
        with:
          name: Telegram-Drive-android-test-apk
          path: ${{ runner.temp }}/Telegram-Drive-test.apk
          if-no-files-found: error
          retention-days: 14

      - name: Clean temporary keystore
        if: always()
        run: rm -f "${RUNNER_TEMP}/telegram-drive-test.p12"
